<p-dialog [(visible)]="visible"
          modal="true"
          [closable]="false"
          [style]="{width: '40vw'}">

  <ng-template pTemplate="header">
    <h3>{{ paciente ? 'Editar Paciente' : 'Nuevo Paciente' }}</h3>
  </ng-template>

  <form [formGroup]="form">
    <div class="formgrid grid">
      <div class="field col-12 md:col-6">
        <label for="nombre">Nombre *</label>
        <input pInputText formControlName="nombre">
      </div>

      <div class="field col-12 md:col-6">
        <label>Tipo de Documento</label>
        <input pInputText formControlName="tipoDocumento">
      </div>

      <div class="field col-12 md:col-6">
        <label>Identificación *</label>
        <input pInputText formControlName="documento">
      </div>

      <div class="field col-12 md:col-6">
        <label>Email</label>
        <input pInputText formControlName="email">
      </div>

      <div class="field col-12 md:col-6">
        <label>Teléfono</label>
        <input pInputText formControlName="telefono">
      </div>

      <div class="field col-12 md:col-6">
        <label>Dirección</label>
        <input pInputText formControlName="direccion">
      </div>

      <div class="field col-12 md:col-6">
        <label>EPS</label>
        <input pInputText formControlName="eps">
      </div>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <button pButton label="Cancelar" class="p-button-text" (click)="cerrar()"></button>
    <button pButton label="Guardar" (click)="guardar()" [disabled]="form.invalid"></button>
  </ng-template>

</p-dialog>
