<h2><span class="pi pi-exclamation-triangle" style="font-size: 2rem"></span> Pacientes Crónicos - Panel de riesgo</h2>

<p-table 
  #dt2
  [value]="pacientes" 
  [paginator]="true" 
  [rows]="10" 
  [loading]="loading"
  [rowHover]="true"
  sortField="nivel_riesgo"
  [sortOrder]="-1"
  responsiveLayout="stack"
  [globalFilterFields]="['nombre', 'nivelRiesgo', 'tipoAlerta', 'alertaDescripcion', 'fechaAlerta', 'ultimoValor', 'estado']">

  <ng-template #caption>
    <div class="flex">
        <p-iconfield iconPosition="left" class="ml-auto">
            <p-inputicon>
                <i class="pi pi-search"></i>
            </p-inputicon>
            <input pInputText type="text" (input)="dt2.filterGlobal($event.target.value, 'contains')" placeholder="Buscar..." />
        </p-iconfield>
    </div>
  </ng-template>

  <ng-template pTemplate="header">
      <tr>
          <th pSortableColumn="nombre">Paciente <p-sortIcon field="nombre"></p-sortIcon></th>
          <th>Nivel riesgo</th>
          <th>Última alerta</th>
          <th>Fecha alerta</th>
          <th>Último registro</th>
          <th>Estado</th>
      </tr>
  </ng-template>

  <ng-template pTemplate="body" let-p>
      <tr>
          <td>{{ p.nombre }}</td>

          <td>
              <span 
                class="badge-riesgo" 
                [style.background]="getColor(p.nivelRiesgo)">
                {{ p.nivelRiesgo | uppercase }}
              </span>
          </td>

          <td>{{ p.tipoAlerta }} – {{ p.alertaDescripcion }}</td>

          <td>{{ p.fechaAlerta | date:'short' }}</td>

          <td>
            {{ p.tipoRegistro }}: {{ p.ultimoValor }}
          </td>

          <td>{{ p.estado }}</td>
      </tr>
  </ng-template>

</p-table>
