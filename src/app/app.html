<!-- Topbar -->
<header class="topbar">
  <button pButton
          icon="pi pi-bars"
          class="p-button-lg"
          (click)="sidebarVisible = !sidebarVisible"
          *ngIf="isAuthenticated()">
  </button>
</header>

<!-- Sidebar -->
<p-drawer [(visible)]="sidebarVisible"
          [modal]="false"
          [showCloseIcon]="true"
          styleClass="custom-sidebar"
          [closable]="true"
          [dismissible]="true"
          *ngIf="isAuthenticated()">

  <h3 class="sidebar-title">Menú</h3>

  <p-menu [model]="menuItems"></p-menu>

  <button pButton type="button" label="Cerrar sesión" class="w-full mt-3" (click)="logout()"></button>
</p-drawer>

<!-- Contenido principal -->
<div class="content" [class.push-content]="sidebarVisible">
  <router-outlet></router-outlet>
</div>
